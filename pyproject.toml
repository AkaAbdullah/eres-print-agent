[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eres-print-agent"
version = "1.0.6"
description = "ERES Print Agent — terminal/service-based background printer bridge for ERES."
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.6,<3",
    "websockets>=12,<13",
    "keyring>=24,<26",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
windows = [
    "pywin32>=306; sys_platform == 'win32'",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[project.scripts]
eres-print-agent = "eres_print_agent.cli:main"

[tool.setuptools.packages.find]
include = ["eres_print_agent*"]
