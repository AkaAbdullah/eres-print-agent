name: Build Windows Installer

# Runs on a real Windows runner since PyInstaller/pywin32/Inno Setup all
# need Windows to produce a working artifact — this can't be built on the
# macOS/Linux dev machine. Triggered manually or by pushing a version tag
# (git tag v1.0.0 && git push origin v1.0.0), which also attaches the
# installer to a GitHub Release.
on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

permissions:
  contents: write # needed for softprops/action-gh-release to create the release + upload the asset

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[windows,dev]"
          pip install pyinstaller

      - name: Run tests
        run: pytest -q

      - name: Download and verify SumatraPDF (pinned checksum)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://www.sumatrapdfreader.org/dl/rel/3.6.1/SumatraPDF-3.6.1-64.zip"
          # Pinned to the exact bytes fetched and hashed by hand on 2026-08-22 —
          # not a third-party-published checksum (SumatraPDF doesn't publish
          # one), but this still catches any future tampering with that URL:
          # a mismatch fails the build loudly instead of silently bundling
          # whatever shows up.
          $expectedZipSha256 = "98b33a518d42986856d225064b0cd2d3643ecf78cbf84ab873d26cc51877a544"

          Invoke-WebRequest -Uri $url -OutFile sumatra.zip
          $actual = (Get-FileHash sumatra.zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expectedZipSha256) {
            Write-Error "SumatraPDF zip checksum mismatch! Expected $expectedZipSha256, got $actual. Refusing to continue."
            exit 1
          }

          Expand-Archive -Path sumatra.zip -DestinationPath sumatra_extracted
          Copy-Item "sumatra_extracted\SumatraPDF-3.6.1-64.exe" "installer\SumatraPDF.exe"

      - name: Build exe with PyInstaller
        run: pyinstaller installer/build_exe.spec --distpath dist --workpath build --noconfirm

      - name: Locate or install Inno Setup
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y
          }

      - name: Compile installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\eres-print-agent.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ERESPrintAgentSetup
          path: installer/Output/ERESPrintAgentSetup.exe
          retention-days: 90

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Output/ERESPrintAgentSetup.exe
